# Builds the Windows (NSIS .exe + MSI) and macOS (.dmg, universal) installers on GitHub runners
# and attaches them to a draft release "app-v<version>" (version from src-tauri/tauri.conf.json)
# in the PUBLIC repo Quangdung1996/ams-desktop-releases: it holds only a README and the releases, so
# this repo (the code) can stay private while the updater downloads anonymously. The tag there points
# at that repo's own README commit (releaseCommitish), never at code from here.
# Installed apps auto-update only after that draft is published (releases/latest skips drafts),
# so publishing the draft is the release gate.
# Based on https://v2.tauri.app/distribute/pipelines/github/ ; manual trigger so a release is a decision,
# not a side effect of every push.
name: build

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            # .exe (NSIS, per-user, no admin) for staff; .msi (WiX, per-machine) for IT deployment.
            # Each install updates with its own format: the updater reads windows-x86_64-{nsis|msi}.
            args: --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          # Fine-grained token: only ams-desktop-releases, Contents read/write (this repo's own
          # GITHUB_TOKEN cannot write to another repo).
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Signs the updater artifacts; must match plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # macOS: Developer ID signing + notarization (Gatekeeper opens it without "Open Anyway").
          # The env identity overrides bundle.macOS.signingIdentity ("-", ad-hoc for local builds).
          # Ignored by the Windows job.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          owner: Quangdung1996
          repo: ams-desktop-releases
          releaseCommitish: main
          tagName: app-v__VERSION__
          releaseName: AMS v__VERSION__
          releaseBody: Download the installer for your OS from the assets below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Also attach the installers to the run page: the draft release is visible only to repo admins.
          uploadWorkflowArtifacts: true
          # Fallback key windows-x86_64 (installs that predate per-installer keys) -> NSIS, no UAC prompt.
          updaterJsonPreferNsis: true
