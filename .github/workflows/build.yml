# Builds the Windows (NSIS .exe) and macOS (.dmg, universal) installers on GitHub runners
# and attaches them to a draft release "app-v<version>" (version from src-tauri/tauri.conf.json).
# Installed apps auto-update only after that draft is published (releases/latest skips drafts),
# so publishing the draft is the release gate.
# Based on https://v2.tauri.app/distribute/pipelines/github/ ; manual trigger so a release is a decision,
# not a side effect of every push.
name: build

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            # NSIS only: one Windows installer for the updater, per-user install (no admin), no VBSCRIPT/WiX.
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; must match plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: app-v__VERSION__
          releaseName: AMS v__VERSION__
          releaseBody: Download the installer for your OS from the assets below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Also attach the installers to the run page: the draft release is visible only to repo admins.
          uploadWorkflowArtifacts: true
