# Builds the Windows (NSIS .exe + MSI) and macOS (.dmg, universal) installers on GitHub runners
# and attaches them to a draft release "app-v<version>" (version from src-tauri/tauri.conf.json)
# in the PUBLIC repo Quangdung1996/ams-desktop-releases: it holds only a README and the releases, so
# this repo (the code) stays private while the updater downloads anonymously. The tag there points
# at that repo's own README commit (releaseCommitish), never at code from here.
# The `publish` job publishes that draft once BOTH builds succeeded (installed apps see only
# published releases: releases/latest skips drafts); if one fails it stays a draft.
# Based on https://v2.tauri.app/distribute/pipelines/github/ ; manual trigger so a release is a decision,
# not a side effect of every push.
name: build

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64, ~3 min with a warm cache. If jobs sit queued and get cancelled ("not acquired by
          # Runner"), the arm64 pool is out of capacity: use macos-15-intel (also builds universal,
          # but much slower).
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            # .exe (NSIS, per-user, no admin) for staff; .msi (WiX, per-machine) for IT deployment.
            # Each install updates with its own format: the updater reads windows-x86_64-{nsis|msi}.
            args: --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Every build gets a new version: <major.minor from tauri.conf.json>.<run number>, e.g. 1.0.9.
      # A big change: raise major/minor in tauri.conf.json (2.0.0). Both jobs of a run share the
      # number, so they land in the same release. Not committed: the repo keeps <major.minor>.0.
      - name: Version
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), f = "src-tauri/tauri.conf.json", c = JSON.parse(fs.readFileSync(f, "utf8"));
            const [major, minor] = c.version.split(".");
            c.version = `${major}.${minor}.${process.env.GITHUB_RUN_NUMBER}`;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
            console.log(c.version);
          '

      - uses: tauri-apps/tauri-action@v1
        env:
          # Fine-grained token: only ams-desktop-releases, Contents read/write (this repo's own
          # GITHUB_TOKEN cannot write to another repo).
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Signs the updater artifacts; must match plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # macOS: Developer ID signing + notarization (Gatekeeper opens it without "Open Anyway").
          # The env identity overrides bundle.macOS.signingIdentity ("-", ad-hoc for local builds).
          # Ignored by the Windows job.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          owner: Quangdung1996
          repo: ams-desktop-releases
          releaseCommitish: main
          tagName: app-v__VERSION__
          releaseName: AMS phiên bản __VERSION__
          # Also the `notes` of latest.json. Public: install steps only, never change details.
          releaseBody: |
            Tải bản cài đặt ở mục **Assets** bên dưới:
            - **macOS** (chip Apple và Intel): file `.dmg`
            - **Windows**: file `-setup.exe`

            Máy đã cài AMS sẽ tự hỏi cập nhật lên bản này.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Also attach the installers to the run page: the draft release is visible only to repo admins.
          uploadWorkflowArtifacts: true
          # Fallback key windows-x86_64 (installs that predate per-installer keys) -> NSIS, no UAC prompt.
          updaterJsonPreferNsis: true

  # Publishes only when every build job succeeded, so latest.json always has macOS and Windows.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # Same version as the Version step of the build jobs.
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version.split(".").slice(0, 2).join(".")').$GITHUB_RUN_NUMBER
          gh release edit "app-v$version" -R Quangdung1996/ams-desktop-releases --draft=false --latest
          echo "Published app-v$version"
